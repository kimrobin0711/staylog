name = "staylog"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Achtung: Sobald diese Datei existiert, gilt sie allein. Alle Bindungen
# muessen hier stehen, auch die, die frueher im Dashboard gepflegt wurden.
# Geheimnisse und Textvariablen bleiben dagegen im Dashboard.

[[d1_databases]]
binding = "DB"
database_name = "staylog"
database_id = "484f9a78-afbb-40fb-882d-7f013525da1b"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "staylog-photos"
